# Lokale database voor PixelDepot WMS.
# Starten: docker compose up -d   ·   Stoppen: docker compose down
services:
  db:
    image: mysql:8.4
    container_name: pixeldepot-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Poort 3307 op je Mac, zodat hij niet botst met een MySQL van XAMPP op 3306
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Draait alleen bij een nieuwe, lege database
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
